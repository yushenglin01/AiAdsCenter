<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">AdNova 星曜智投技术架构图</title>
  <desc id="desc">展示用户入口、场景产品、领域模块、核心平台、基础设施与外部系统，以及贯穿全局的治理和安全能力。</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f5ff"/>
    </linearGradient>
    <linearGradient id="bluePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#edf5ff"/>
    </linearGradient>
    <linearGradient id="tealPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3fdfd"/>
      <stop offset="1" stop-color="#e9f8f7"/>
    </linearGradient>
    <linearGradient id="purplePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaff"/>
      <stop offset="1" stop-color="#f1edff"/>
    </linearGradient>
    <linearGradient id="corePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5faff"/>
      <stop offset="0.5" stop-color="#edf6ff"/>
      <stop offset="1" stop-color="#f4f1ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#123b7a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3478e5"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8058d9"/>
    </marker>
    <style>
      text { font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 44px; font-weight: 800; fill: #0b1b3f; letter-spacing: .5px; }
      .subtitle { font-size: 17px; font-weight: 500; fill: #52637e; }
      .layer-title { font-size: 22px; font-weight: 800; fill: #1050b5; }
      .layer-en { font-size: 14px; font-weight: 700; fill: #3670c8; letter-spacing: .3px; }
      .layer-title-teal { font-size: 22px; font-weight: 800; fill: #087b7b; }
      .layer-en-teal { font-size: 14px; font-weight: 700; fill: #238d8f; }
      .num { font-size: 20px; font-weight: 800; fill: #fff; text-anchor: middle; dominant-baseline: central; }
      .icon { font-size: 18px; font-weight: 800; fill: #1260cc; text-anchor: middle; dominant-baseline: central; }
      .icon-teal { font-size: 17px; font-weight: 800; fill: #078486; text-anchor: middle; dominant-baseline: central; }
      .card-title { font-size: 17px; font-weight: 750; fill: #102548; text-anchor: middle; }
      .card-body { font-size: 13px; font-weight: 500; fill: #53627a; text-anchor: middle; }
      .domain-title { font-size: 16px; font-weight: 800; fill: #075f67; text-anchor: middle; }
      .domain-body { font-size: 13px; font-weight: 550; fill: #405e66; text-anchor: middle; }
      .group-title { font-size: 18px; font-weight: 800; fill: #155bbd; }
      .group-title-teal { font-size: 18px; font-weight: 800; fill: #087c80; }
      .mini { font-size: 14px; font-weight: 650; fill: #203653; }
      .mini-sub { font-size: 11px; font-weight: 500; fill: #66758b; }
      .gov-title { font-size: 22px; font-weight: 800; fill: #fff; text-anchor: middle; }
      .gov-card { font-size: 16px; font-weight: 750; fill: #4e2b91; text-anchor: middle; }
      .gov-sub { font-size: 12px; font-weight: 500; fill: #77679b; text-anchor: middle; }
      .note { font-size: 17px; font-weight: 700; fill: #173b72; text-anchor: middle; }
    </style>
